<div class="task-list-page">
  <mat-form-field appearance="outline" class="task-list-page__search">
    <mat-label>Search tasks</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Search by title or description..." />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <app-task-filter-bar
    [status]="status()"
    [priority]="priority()"
    (statusChange)="onStatusFilterChange($event)"
    (priorityChange)="onPriorityFilterChange($event)"
    (newTask)="openCreateDialog()"
  />

  <div class="task-list-page__board">
    @for (column of columns; track column.status) {
      <app-task-column
        [status]="column.status"
        [title]="column.title"
        [tasks]="tasksByStatus()[column.status]"
        [connectedTo]="columnIds(column.status)"
        (dropped)="onDrop($event)"
        (edit)="openEditDialog($event)"
        (delete)="onDeleteTask($event)"
        (statusChange)="onStatusChange($event)"
      />
    }
  </div>
</div>
