<div class="task-card" [class.task-card--overdue]="isOverdue()">
  <div class="task-card__header">
    <span class="task-card__priority task-card__priority--{{ task().priority }}">{{ task().priority }}</span>

    @if (!readonlyMode()) {
      <button
        mat-icon-button
        type="button"
        class="task-card__menu-trigger"
        [matMenuTriggerFor]="menu"
        aria-label="Task actions"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item type="button" (click)="onEdit()">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </button>
        <button mat-menu-item type="button" (click)="onDelete()">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
        @for (status of nextStatuses(); track status) {
          <button mat-menu-item type="button" (click)="onStatusChange(status)">
            <mat-icon>arrow_forward</mat-icon>
            <span>Move to {{ status }}</span>
          </button>
        }
      </mat-menu>
    }
  </div>

  <h3 class="task-card__title">{{ task().title }}</h3>
  <p class="task-card__description">{{ task().description }}</p>

  <span class="task-card__due-date task-card__due-date--{{ dueStatus().variant }}">
    <mat-icon inline>{{ dueStatus().icon }}</mat-icon>
    {{ dueStatus().label }}
  </span>
  @if (task().tags.length) {
    <div class="task-card__tags">
      @for (tag of task().tags; track tag) {
        <span class="task-card__tag">{{ tag }}</span>
      }
    </div>
  }

  <div class="task-card__footer">
    <span class="task-card__assignee">
      <app-user-avatar [user]="task().assignee" size="sm" />
      <span class="task-card__assignee-name">@{{ task().assignee.name }}</span>
    </span>
  </div>
</div>
