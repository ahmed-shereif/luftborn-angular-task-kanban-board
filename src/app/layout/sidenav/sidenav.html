<nav class="app-sidenav">
  <ul class="app-sidenav__list">
    @for (link of links; track link.path) {
      <li>
        <a
          class="app-sidenav__item"
          [routerLink]="link.path"
          routerLinkActive="app-sidenav__item--active"
        >
          <mat-icon class="app-sidenav__icon">{{ link.icon }}</mat-icon>
          <span class="app-sidenav__label">{{ link.label }}</span>
        </a>
      </li>
    }
  </ul>

  <button class="app-sidenav__new-task" mat-flat-button type="button" (click)="openCreateTask()">
    <mat-icon>add</mat-icon>
    New Task
  </button>
</nav>
